general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = {{ image }}

    color = rgb({{ colors.surface.default.hex_stripped }})

    blur_passes = 2
    blur_size = 5
    brightness = 0.65
    vibrancy = 0.15
}

# Hora
label {
    monitor =
    text = $TIME

    color = rgb({{ colors.on_surface.default.hex_stripped }})
    font_size = 72
    font_family = DejaVu Sans

    position = 0, 150
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date "+%A, %d de %B"

    color = rgb({{ colors.on_surface_variant.default.hex_stripped }})
    font_size = 18
    font_family = DejaVu Sans

    position = 0, 85
    halign = center
    valign = center
}

# Usuario
label {
    monitor =
    text = $USER

    color = rgb({{ colors.primary.default.hex_stripped }})
    font_size = 16
    font_family = DejaVu Sans

    position = 0, 20
    halign = center
    valign = center
}

# Contraseña
input-field {
    monitor =

    size = 320, 55
    outline_thickness = 3

    dots_size = 0.22
    dots_spacing = 0.20
    dots_center = true

    outer_color = rgb({{ colors.primary.default.hex_stripped }})
    inner_color = rgb({{ colors.surface_variant.default.hex_stripped }})
    font_color = rgb({{ colors.on_surface.default.hex_stripped }})

    check_color = rgb({{ colors.secondary.default.hex_stripped }})
    fail_color = rgb({{ colors.error.default.hex_stripped }})

    placeholder_text = <i>Contraseña...</i>
    fail_text = <i>$FAIL</i>

    rounding = 15

    position = 0, -55
    halign = center
    valign = center
}
